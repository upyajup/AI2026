<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인공지능일반 포트폴리오 | 김태윤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .card-hover:hover { transform: scale(1.02); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="relative overflow-hidden py-32 text-center bg-indigo-900 text-white">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-20"></div>
        <div class="relative z-10 px-4">
            <span class="inline-block py-1 px-3 rounded-full bg-indigo-500/30 text-indigo-200 text-sm font-semibold mb-4 border border-indigo-400/30">AI General Portfolio 2026</span>
            <h1 class="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight">AI, 미래를 설계하다</h1>
            <p class="text-lg md:text-xl text-indigo-100 max-w-2xl mx-auto opacity-90">인공지능일반 교과목을 통해 탐구한 기술적 성취와 데이터 기반의 문제 해결 여정을 기록합니다.</p>
        </div>
    </header>

    <section class="max-w-4xl mx-auto -mt-16 px-4 relative z-20">
        <div class="glass p-8 md:p-10 rounded-3xl shadow-xl border border-white/50 flex flex-col md:flex-row items-center gap-8">
            <div class="w-32 h-32 bg-indigo-600 rounded-full flex items-center justify-center text-white text-4xl font-bold shadow-lg border-4 border-white">김태윤</div>
            <div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">김태윤 | Computer Science Aspirant</h2>
                <p class="text-slate-600 mb-4">컴퓨터공학과 진학을 목표로 하는 고등학생입니다. 인공지능 기술의 윤리적 활용과 데이터 분석을 통해 실질적인 문제 해결을 시도하고 있습니다.</p>
                <div class="flex gap-3">
                    <span class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-semibold">#ComputerScience</span>
                    <span class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-semibold">#AI_Learning</span>
                </div>
            </div>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 py-20">
        <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected via JS -->
        </div>
    </main>

    <script>
        const portfolioItems = [
            { title: "생성형 AI 활용 원칙", desc: "윤리적 AI 사용을 위한 가이드라인 정립" },
            { title: "진로 데이터 분석", desc: "나의 진로 분야 데이터 탐색 및 인사이트" },
            { title: "나의 진로 리포트", desc: "데이터 기반의 맞춤형 진로 로드맵" },
            { title: "학교 문제 해결 웹앱", desc: "학내 불편사항 개선 솔루션 구현" },
            { title: "최종 성찰 내용", desc: "학습 여정의 회고와 미래 성장 비전" }
        ];

        const grid = document.getElementById('portfolio-grid');

        portfolioItems.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-3xl shadow-sm border border-slate-100 card-hover fade-in";
            card.style.transitionDelay = `${index * 0.1}s`;
            card.innerHTML = `
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-6 font-bold text-xl shadow-inner">0${index + 1}</div>
                <h3 class="text-lg font-bold mb-2 text-slate-800">${item.title}</h3>
                <p class="text-slate-500 text-sm leading-relaxed">${item.desc}</p>
            `;
            grid.appendChild(card);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    </script>

    <footer class="py-12 text-center bg-white border-t border-slate-100">
        <p class="text-slate-400 text-sm">&copy; 2026 AI General Portfolio. Built with curiosity.</p>
    </footer>
</body>
</html>
